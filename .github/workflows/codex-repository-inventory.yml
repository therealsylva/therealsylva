name: Check repository archive access

on:
  push:
    branches:
      - "codex/repo-archive-*"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Capture accessible repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate '/user/repos?affiliation=owner&per_page=100' > inventory.json
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: repository-inventory
          path: inventory.json
          retention-days: 1
