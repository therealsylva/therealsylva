name: Export repository bundle

on:
  push:
    branches:
      - "codex/repo-archive-*"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create Git bundle
        run: |
          git bundle create "repository.bundle" --all
          ls -lh "repository.bundle"
      - name: Upload repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: repository-bundle
          path: repository.bundle
          retention-days: 1
